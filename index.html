<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prompt Lab — Prompt · Context · Harness · Loop</title>
<meta name="description" content="An interactive, single-file sandbox that teaches four core LLM engineering concepts — Prompt, Context, Harness, and Loop — through live calls to the Groq API.">
<meta property="og:title" content="Prompt Lab — Prompt · Context · Harness · Loop">
<meta property="og:description" content="An interactive, single-file sandbox that teaches four core LLM engineering concepts — Prompt, Context, Harness, and Loop — through live calls to the Groq API.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#B49CF6;        /* lavender field */
    --ink:#141414;          /* border black */
    --paper:#FFF9F0;        /* card cream */
    --orange:#FFB147;       /* stage 1 prompt */
    --lime:#C7F464;         /* stage 2 context */
    --pink:#FF9ADF;         /* stage 3 harness */
    --sky:#7DD3FC;          /* stage 4 loop */
    --red:#FF6B5E;
    --shadow:5px 5px 0 var(--ink);
    --shadow-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--field);color:var(--ink);
    font-family:'Space Grotesk',-apple-system,sans-serif;
    padding:18px 14px 60px;min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:2px}
  h1{font-family:'Archivo Black',sans-serif;font-size:34px;margin:0 0 4px;line-height:1.05;text-transform:uppercase}
  .sub{font-size:13.5px;font-weight:500;margin:0 0 16px}

  .btn{
    border:3px solid var(--ink);border-radius:12px;padding:12px 14px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
    background:var(--paper);box-shadow:var(--shadow-sm);cursor:pointer;
    transition:transform .05s, box-shadow .05s;color:var(--ink);
  }
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .btn.full{width:100%;padding:14px;font-size:15px;box-shadow:var(--shadow)}
  .btn.full:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}

  /* stage tabs */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .tab{
    border:3px solid var(--ink);border-radius:14px;padding:10px 2px;
    font-family:'Space Mono',monospace;font-weight:700;font-size:11px;text-align:center;
    background:var(--paper);cursor:pointer;box-shadow:var(--shadow-sm);
  }
  .tab .n{display:block;font-family:'Archivo Black',sans-serif;font-size:17px}
  .tab.active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .tab.locked{opacity:.45;background:#d9d0f5;box-shadow:none;cursor:default}

  /* main card */
  .card{
    border:3px solid var(--ink);border-radius:20px;background:var(--paper);
    box-shadow:var(--shadow);padding:18px 16px;
  }
  .stage-title{font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;margin:0 0 12px;
    display:inline-block;padding:4px 10px;border:3px solid var(--ink);border-radius:10px;box-shadow:var(--shadow-sm)}

  .teach{
    border:3px solid var(--ink);border-radius:14px;padding:12px 13px;
    font-size:13.5px;line-height:1.5;margin-bottom:14px;box-shadow:var(--shadow-sm);
  }
  .teach .tag{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;display:block;margin-bottom:5px}

  textarea{
    width:100%;border:3px solid var(--ink);border-radius:14px;padding:12px;
    font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.5;background:#fff;
    resize:vertical;outline:none;margin-bottom:12px;
  }
  .presets{display:flex;gap:8px;margin-bottom:10px}
  .preset{
    flex:1;border:3px solid var(--ink);border-radius:10px;padding:9px 4px;
    font-weight:700;font-size:12px;background:#fff;cursor:pointer;
  }
  .preset.on{background:var(--orange);box-shadow:var(--shadow-sm)}

  .out{
    border:3px solid var(--ink);border-radius:14px;background:#fff;
    padding:12px;margin-top:12px;box-shadow:var(--shadow-sm);
  }
  .out .lbl{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  .out .body{font-size:13px;line-height:1.55;white-space:pre-wrap;max-height:330px;overflow-y:auto}

  .take{font-size:12.5px;line-height:1.5;margin-top:12px;padding:10px 12px;
    border:3px dashed var(--ink);border-radius:12px;background:#fff}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;
    border:3px solid var(--ink);border-radius:14px;padding:10px 13px;margin-bottom:10px;
    background:var(--lime);box-shadow:var(--shadow-sm);font-weight:700;font-size:14px}
  .switch{width:52px;height:28px;border:3px solid var(--ink);border-radius:16px;background:#fff;position:relative;cursor:pointer}
  .switch .knob{width:18px;height:18px;border-radius:50%;background:var(--ink);position:absolute;top:2px;left:3px;transition:left .12s}
  .switch.on{background:var(--lime)}
  .switch.on .knob{left:25px}

  .log{border:3px solid var(--ink);border-radius:14px;background:var(--ink);color:#fff;
    padding:12px;margin-top:12px;font-family:'Space Mono',monospace;font-size:12px}
  .log .row{display:flex;gap:8px;margin-bottom:4px}
  .pass{color:var(--lime);font-weight:700}.fail{color:var(--red);font-weight:700}
  .log .lbl{font-size:10px;letter-spacing:1.5px;color:var(--pink);margin-bottom:8px;font-weight:700}

  .score-big{font-family:'Archivo Black',sans-serif;font-size:42px;line-height:1}
  .score-big small{font-family:'Space Mono',monospace;font-size:14px}

  .iter{border:3px solid var(--ink);border-radius:14px;padding:12px;margin-top:12px;box-shadow:var(--shadow-sm);background:#fff}
  .iter .head{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;margin-bottom:6px}
  .iter .chip{border:2px solid var(--ink);border-radius:8px;padding:1px 8px}
  .stopbox{margin-top:12px;border:3px solid var(--ink);border-radius:14px;padding:12px;
    font-family:'Space Mono',monospace;font-weight:700;font-size:13px;box-shadow:var(--shadow-sm)}

  .spin{display:inline-block;width:14px;height:14px;border:3px solid var(--ink);border-top-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .busy{margin-top:12px;font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700}

  .mantra{margin-top:18px;font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;
    line-height:1.7;text-align:center}
  .err{color:#B3261E;font-weight:700;font-size:13px;margin-top:10px}

  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">LLM ENGINEERING · INTERACTIVE SANDBOX</div>
  <h1>Prompt<br>Lab</h1>
  <p class="sub">Prompt → Context → Harness → Loop. Every button is a real Groq call.</p>
  <div id="topicBar"></div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="stageCard"></div>

  <div class="mantra">
    prompt = the sentence · context = the ingredients<br>
    harness = the kitchen · loop = the restaurant
  </div>
</div>

<script src="config.js"></script>
<script>
/* ================= STATE ================= */
const LAYERS = {
  1:{name:'Prompt', color:'var(--orange)'},
  2:{name:'Context',color:'var(--lime)'},
  3:{name:'Harness',color:'var(--pink)'},
  4:{name:'Loop',   color:'var(--sky)'},
};
const MODEL = 'llama-3.3-70b-versatile';
const TOPIC_KEY = 'promptlab.topic';
const RUBRIC = `EXAMPLE RUBRIC — edit this for your own use case (100 pts max):
- Market Need (0-30): would people actually want or pay for this today?
- Feasibility (0-25): buildable with realistic time, skill, and technology
- Differentiation (0-25): a clear reason this beats existing alternatives
- Cost to Build (0-20): lower cost and effort to launch scores higher
Gate: 50+ to advance. 85+ = STRONG pass.`;

/* ---- topic-driven prompt templates: every learning area builds off the same user topic ---- */
const buildVaguePrompt = (topic) => 'Evaluate this product idea: ' + topic;
const buildStructuredPrompt = (topic) => 'You are a product analyst. Evaluate this product idea in exactly 3 sections: (1) Strengths, (2) Fatal risks, (3) Verdict in one sentence. Be blunt and specific.\n\nIdea: ' + topic;
const buildExamplePrompt = (topic) => 'You are a product analyst. Evaluate the idea below.\n\nExample of the verdict style I want: "REJECT — the cost to build outweighs any realistic differentiation; this loses to existing alternatives."\n\nGive: (1) Strengths, (2) Fatal risks, (3) A verdict in that exact blunt style.\n\nIdea: ' + topic;
const buildContextPrompt = (topic) => 'You are the product evaluator. Score this product idea against the rubric and give a total with per-criterion breakdown, then a one-line verdict.\n\nIdea: ' + topic;
const buildHarnessPrompt = (topic) => RUBRIC + '\n\nScore this idea against the rubric.\n\nIdea: ' + topic;
const buildLoopPrompt = (topic) => RUBRIC + '\n\nScore this idea, name its single biggest weakness, and rewrite it stronger.\n\nIdea: ' + topic;

function buildPrompts(topic){
  return { vague: buildVaguePrompt(topic), structured: buildStructuredPrompt(topic), examples: buildExamplePrompt(topic) };
}

let PROMPTS = { vague:'', structured:'', examples:'' };
let S2_PROMPT = '';

function freshStageState(topic){
  PROMPTS = buildPrompts(topic);
  S2_PROMPT = buildContextPrompt(topic);
  return {
    stage:1, unlocked:1, busy:false,
    s1:{preset:'vague', prompt:PROMPTS.vague, out:'', err:''},
    s2:{ctxOn:true, context:RUBRIC, out:''},
    s3:{log:[], parsed:null},
    s4:{idea:topic, iters:[], stop:'', stopFlag:false},
  };
}

function safeStorageGet(key){ try{ return localStorage.getItem(key); }catch(_){ return null; } }
function safeStorageSet(key, val){ try{ localStorage.setItem(key, val); }catch(_){} }
function safeStorageRemove(key){ try{ localStorage.removeItem(key); }catch(_){} }

let S = { topic:null, topicDraft:'', topicErr:'', busy:false };
const savedTopic = safeStorageGet(TOPIC_KEY);
if(savedTopic){
  Object.assign(S, freshStageState(savedTopic));
  S.topic = savedTopic;
}

/* ================= KEY =================
   The API key is injected by the Pages workflow into config.js as window.GROQ_KEY. */
function getKey(){
  return (typeof window.GROQ_KEY === 'string' && window.GROQ_KEY.indexOf('gsk_') === 0) ? window.GROQ_KEY : '';
}

/* ================= GROQ ================= */
async function callGroq(userContent, system){
  const key = getKey();
  if(!key){ throw new Error('CONFIG_KEY_MISSING'); }
  const messages = [];
  if(system) messages.push({role:'system', content:system});
  messages.push({role:'user', content:userContent});
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body: JSON.stringify({model:MODEL, messages, max_tokens:1000, temperature:0.7})
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error('HTTP '+res.status+': '+t.slice(0,140));
  }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message.content) || '';
}
function stripFences(t){ return t.replace(/```json|```/g,'').trim(); }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

/* ================= RENDER ================= */
function render(){
  renderTopicBar();
  const el = document.getElementById('stageCard');
  const tabsEl = document.getElementById('tabs');
  if(!S.topic){
    tabsEl.innerHTML = '';
    el.innerHTML = viewTopicGate();
    return;
  }
  renderTabs();
  if(S.stage===1) el.innerHTML = viewS1();
  if(S.stage===2) el.innerHTML = viewS2();
  if(S.stage===3) el.innerHTML = viewS3();
  if(S.stage===4) el.innerHTML = viewS4();
}
function renderTopicBar(){
  const b = document.getElementById('topicBar');
  if(!b) return;
  if(!S.topic){ b.innerHTML=''; return; }
  b.innerHTML = `<div style="font-size:12.5px;font-weight:700;margin:-6px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">Topic: ${esc(S.topic)}</span>
    <button class="btn" style="padding:5px 10px;font-size:11px;flex:none" onclick="changeTopic()">Change topic</button>
  </div>`;
}

/* ================= TOPIC GATE ================= */
function viewTopicGate(){
  return `
  <div class="stage-title" style="background:${LAYERS[1].color}">Pick a topic</div>
  ${teach(1,'Every stage below — <b>Prompt, Context, Harness, Loop</b> — runs on the same topic. Enter a business idea, product idea, or problem once, then watch the same prompt improve across layers.')}
  <textarea id="topicInput" rows="3" placeholder="e.g. AI app that turns Google Photos albums into memory movies" oninput="onTopicInput(this.value)">${esc(S.topicDraft||'')}</textarea>
  <button class="btn full" style="background:${LAYERS[1].color}" onclick="submitTopic()">Start Prompt Lab</button>
  ${S.topicErr?`<div class="err">${esc(S.topicErr)}</div>`:''}
  `;
}
function onTopicInput(v){ S.topicDraft = v; }
function wordCount(s){ return (s.trim().match(/\S+/g)||[]).length; }
function submitTopic(){
  const val = (S.topicDraft||'').trim();
  if(!val){ S.topicErr = 'Enter a topic to continue.'; render(); return; }
  const wc = wordCount(val);
  if(wc<4 || wc>25){ S.topicErr = 'Enter a topic in 4 to 25 words.'; render(); return; }
  safeStorageSet(TOPIC_KEY, val);
  Object.assign(S, freshStageState(val));
  S.topic = val; S.topicDraft = ''; S.topicErr = '';
  render();
}
function changeTopic(){
  if(S.busy) return;
  S.topicDraft = S.topic || '';
  S.topic = null; S.topicErr = '';
  safeStorageRemove(TOPIC_KEY);
  render();
}
function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = [1,2,3,4].map(i=>{
    const L=LAYERS[i], un=i<=S.unlocked, act=i===S.stage;
    return `<div class="tab ${act?'active':''} ${un?'':'locked'}"
      style="${act?'background:'+L.color:''}"
      onclick="${un?`go(${i})`:''}">
      <span class="n">${un?i:'🔒'}</span>${L.name}</div>`;
  }).join('');
}
function go(i){ if(!S.busy){ S.stage=i; render(); } }
function complete(i){ if(i>=S.unlocked) S.unlocked=Math.min(i+1,4); }

function teach(stage, html){
  return `<div class="teach" style="background:${LAYERS[stage].color}">
    <span class="tag">What this layer adds</span>${html}</div>`;
}
function busyRow(txt){ return S.busy?`<div class="busy"><span class="spin"></span>${txt}</div>`:''; }

/* ================= STAGE 1 ================= */
function viewS1(){
  const p=S.s1;
  return `
  <div class="stage-title" style="background:${LAYERS[1].color}">Stage 1 — Prompt</div>
  ${teach(1,'One assembled input → one raw output. No grounding data, no validation, no retry. Try all three presets on the <b>same idea</b> and compare. Then notice what wording alone cannot fix.')}
  <div class="presets">
    ${[['Vague','vague'],['Structured','structured'],['W/ example','examples']].map(([l,k])=>
      `<button class="preset ${p.preset===k?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join('')}
  </div>
  <textarea id="s1prompt" rows="6" oninput="S.s1.prompt=this.value">${esc(p.prompt)}</textarea>
  <button class="btn full" style="background:${LAYERS[1].color}" ${S.busy?'disabled':''} onclick="runS1()">
    ${S.busy?'Calling model…':'Send prompt'}</button>
  ${busyRow('one input → one output')}
  ${p.err?`<div class="err">${esc(p.err)}</div>`:''}
  ${p.out?`<div class="out"><div class="lbl">Raw response</div><div class="body">${esc(p.out)}</div></div>
  <div class="take"><b>Takeaway:</b> better wording → better output, but the model still guesses your criteria. It doesn't know your rubric exists. That's a <b>context</b> problem — Stage 2 unlocked.</div>`:''}`;
}
function setPreset(k){ S.s1.preset=k; S.s1.prompt=PROMPTS[k]; render(); }
async function runS1(){
  S.busy=true; S.s1.out=''; S.s1.err=''; render();
  try{ S.s1.out = await callGroq(S.s1.prompt); complete(1); }
  catch(e){ S.s1.err = e.message==='CONFIG_KEY_MISSING'?'API key is unavailable. Check the repo secret and generated config.js.':'Call failed ('+e.message+'). Run again — Stage 1 has no retry. That is the point.'; }
  S.busy=false; render();
}

/* ================= STAGE 2 ================= */
function viewS2(){
  const p=S.s2;
  return `
  <div class="stage-title" style="background:${LAYERS[2].color}">Stage 2 — Context</div>
  ${teach(2,'Same prompt, but the app now <b>prepends your real scoring rubric</b> before the model sees the task. The code change is string concatenation. The output change: the model stops guessing your criteria. Toggle it off and re-run to feel it.')}
  <div class="toggle-row">Inject example rubric
    <div class="switch ${p.ctxOn?'on':''}" onclick="S.s2.ctxOn=!S.s2.ctxOn;render()"><div class="knob"></div></div>
  </div>
  ${p.ctxOn?`<textarea rows="7" oninput="S.s2.context=this.value">${esc(p.context)}</textarea>`:''}
  <div class="out" style="margin:0 0 12px;box-shadow:none"><div class="lbl">Fixed prompt</div>
    <div class="body" style="font-family:'Space Mono',monospace;font-size:12px">${esc(S2_PROMPT)}</div></div>
  <button class="btn full" style="background:${LAYERS[2].color}" ${S.busy?'disabled':''} onclick="runS2()">
    ${S.busy?'Calling model…':(p.ctxOn?'Run WITH context':'Run WITHOUT context')}</button>
  ${busyRow('context + prompt → model')}
  ${p.out?`<div class="out"><div class="lbl">${p.ctxOn?'Grounded':'Ungrounded'} response</div><div class="body">${esc(p.out)}</div></div>
  <div class="take"><b>Takeaway:</b> context beats cleverness. But output is still free text — nothing guarantees it parses, nothing catches failure. That's a <b>harness</b> problem — Stage 3 unlocked.</div>`:''}`;
}
async function runS2(){
  S.busy=true; S.s2.out=''; render();
  try{
    const full = S.s2.ctxOn ? S.s2.context+'\n\n---\n\n'+S2_PROMPT : S2_PROMPT;
    S.s2.out = await callGroq(full); complete(2);
  }catch(e){ S.s2.out = e.message==='CONFIG_KEY_MISSING'?'API key is unavailable. Check the repo secret and generated config.js.':'Call failed — try again. ('+e.message+')'; }
  S.busy=false; render();
}

/* ================= STAGE 3 ================= */
const JSON_SYS = 'Respond ONLY with valid JSON, no markdown fences, no preamble. Schema: {"score": number (0-100), "strongest": string, "weakest": string, "verdict": string}';
function viewS3(){
  const p=S.s3;
  return `
  <div class="stage-title" style="background:${LAYERS[3].color}">Stage 3 — Harness</div>
  ${teach(3,'The app now <b>demands JSON, validates with JSON.parse(), and auto-retries once on failure</b> — logging every attempt with latency. You stop reading outputs and start reading a run log. The system catches failure, not you.')}
  <button class="btn full" style="background:${LAYERS[3].color}" ${S.busy?'disabled':''} onclick="runS3()">
    ${S.busy?'Harness running…':'Run harnessed call'}</button>
  ${busyRow('call → validate → retry if needed')}
  ${p.log.length?`<div class="log"><div class="lbl">RUN LOG</div>
    ${p.log.map(e=>`<div class="row"><span>#${e.attempt}</span>
      <span class="${e.status==='PASS'?'pass':'fail'}">${e.status}</span>
      <span>${esc(e.detail)}</span></div>`).join('')}</div>`:''}
  ${p.parsed?`<div class="out" style="background:${LAYERS[3].color}">
    <div class="score-big">${p.parsed.score}<small> / 100</small></div>
    <div style="font-size:13px;line-height:1.55;margin-top:8px">
      <div><b>Strongest:</b> ${esc(String(p.parsed.strongest))}</div>
      <div><b>Weakest:</b> ${esc(String(p.parsed.weakest))}</div>
      <div style="margin-top:4px">${esc(String(p.parsed.verdict))}</div></div></div>
  <div class="take"><b>Takeaway:</b> structured output + validation + retry = a call you can build on. But it's still <b>one</b> call. Improving an idea until it clears a bar is a <b>loop</b> problem — Stage 4 unlocked.</div>`:''}`;
}
async function runS3(){
  S.busy=true; S.s3={log:[],parsed:null}; render();
  const MAX=2;
  for(let a=1;a<=MAX;a++){
    const t0=Date.now();
    try{
      const raw = await callGroq(buildHarnessPrompt(S.topic), JSON_SYS);
      const ms=Date.now()-t0;
      try{
        const obj = JSON.parse(stripFences(raw));
        S.s3.log.push({attempt:a,status:'PASS',detail:'valid JSON · '+ms+'ms'});
        S.s3.parsed=obj; complete(3); S.busy=false; render(); return;
      }catch(_){
        S.s3.log.push({attempt:a,status:'FAIL',detail:'malformed JSON · '+ms+'ms · '+(a<MAX?'auto-retrying':'brake tripped')});
        render();
      }
    }catch(e){
      if(e.message==='CONFIG_KEY_MISSING'){ S.s3.log.push({attempt:a,status:'FAIL',detail:'config.js key missing'}); S.busy=false; render(); return; }
      S.s3.log.push({attempt:a,status:'FAIL',detail:'network/API error · '+(a<MAX?'auto-retrying':'brake tripped')});
      render();
    }
  }
  S.busy=false; render();
}

/* ================= STAGE 4 ================= */
const GOAL=85, MAX_ITERS=4;
const LOOP_SYS = 'Respond ONLY with valid JSON, no fences, no preamble. Schema: {"score": number (0-100), "critique": string (the single biggest weakness), "revisedIdea": string (a rewritten stronger version that fixes that weakness while staying feasible to build and clearly differentiated)}';
function viewS4(){
  const p=S.s4;
  return `
  <div class="stage-title" style="background:${LAYERS[4].color}">Stage 4 — Loop</div>
  ${teach(4,`Goal + stop rule: <b>revise until score ≥ ${GOAL}, max ${MAX_ITERS} iterations</b>. Each cycle: score → critique → revise → re-score, feeding results back as new context. The run ends when the job is done or the brake trips — never "when the model stops talking."`)}
  <textarea rows="3" oninput="S.s4.idea=this.value">${esc(p.idea)}</textarea>
  <div style="display:flex;gap:8px">
    <button class="btn full" style="background:${LAYERS[4].color};flex:3" ${S.busy?'disabled':''} onclick="runS4()">
      ${S.busy?'Loop running…':'Run loop'}</button>
    <button class="btn" style="background:var(--red);flex:1" ${S.busy?'':'disabled'} onclick="S.s4.stopFlag=true">STOP</button>
  </div>
  ${busyRow('iterating toward score ≥ '+GOAL)}
  ${p.iters.map(it=>`<div class="iter" style="${it.score!==null&&it.score>=GOAL?'background:'+LAYERS[4].color:''}">
    <div class="head"><span>ITERATION ${it.n}</span>
      <span class="chip">${it.score===null?'ERR':it.score+'/100'}</span></div>
    <div style="font-size:13px;line-height:1.5"><b>Weakness:</b> ${esc(String(it.critique))}</div>
    <div style="font-size:13px;line-height:1.5;margin-top:6px"><b>Revised →</b> ${esc(String(it.revisedIdea))}</div>
  </div>`).join('')}
  ${p.stop?`<div class="stopbox" style="background:${p.stop.startsWith('GOAL')?LAYERS[4].color:'var(--orange)'}">${esc(p.stop)}</div>
  <div class="take"><b>Takeaway:</b> the unit of work is the <b>run</b>, not the reply. Now paste one of your own ideas and see if the loop strengthens it past the gate.</div>`:''}`;
}
async function runS4(){
  S.busy=true; S.s4.iters=[]; S.s4.stop=''; S.s4.stopFlag=false; render();
  let current=S.s4.idea;
  for(let i=1;i<=MAX_ITERS;i++){
    if(S.s4.stopFlag){ S.s4.stop='STOPPED — manual brake'; break; }
    try{
      const raw = await callGroq(buildLoopPrompt(current), LOOP_SYS);
      const obj = JSON.parse(stripFences(raw));
      S.s4.iters.push({n:i,score:obj.score,critique:obj.critique,revisedIdea:obj.revisedIdea});
      render();
      if(obj.score>=GOAL){
        S.s4.stop='GOAL MET — score '+obj.score+' ≥ '+GOAL+' in '+i+' iteration'+(i>1?'s':'');
        complete(4); S.busy=false; render(); return;
      }
      current=obj.revisedIdea;
    }catch(e){
      if(e.message==='CONFIG_KEY_MISSING'){ S.s4.stop='CONFIG ERROR — config.js did not provide the repo API key'; S.busy=false; render(); return; }
      S.s4.iters.push({n:i,score:null,critique:'iteration failed (parse/network) — loop continues',revisedIdea:current});
      render();
    }
  }
  if(!S.s4.stopFlag && !S.s4.stop) S.s4.stop='BRAKE TRIPPED — max '+MAX_ITERS+' iterations, goal not met';
  complete(4); S.busy=false; render();
}

/* ================= INIT ================= */
render();
</script>
</body>
</html>
