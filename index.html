<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Prompt Lab — Prompt · Context · Harness · Loop</title>
<meta name="description" content="An interactive, single-file sandbox that teaches four core LLM engineering concepts — Prompt, Context, Harness, and Loop — on any topic you type, generated live by the Groq API.">
<meta property="og:title" content="Prompt Lab — Prompt · Context · Harness · Loop">
<meta property="og:description" content="An interactive, single-file sandbox that teaches four core LLM engineering concepts — Prompt, Context, Harness, and Loop — on any topic you type, generated live by the Groq API.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#B49CF6;        /* lavender field */
    --ink:#141414;          /* border black */
    --paper:#FFF9F0;        /* card cream */
    --orange:#FFB147;       /* stage 1 prompt */
    --lime:#C7F464;         /* stage 2 context */
    --pink:#FF9ADF;         /* stage 3 harness */
    --sky:#7DD3FC;          /* stage 4 loop */
    --red:#FF6B5E;
    --shadow:5px 5px 0 var(--ink);
    --shadow-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--field);color:var(--ink);
    font-family:'Space Grotesk',-apple-system,sans-serif;
    padding:18px 14px 60px;min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:2px}
  h1{font-family:'Archivo Black',sans-serif;font-size:34px;margin:0 0 4px;line-height:1.05;text-transform:uppercase}
  .sub{font-size:13.5px;font-weight:500;margin:0 0 16px}

  .btn{
    border:3px solid var(--ink);border-radius:12px;padding:12px 14px;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;
    background:var(--paper);box-shadow:var(--shadow-sm);cursor:pointer;
    transition:transform .05s, box-shadow .05s;color:var(--ink);
  }
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:disabled{opacity:.5;pointer-events:none}
  .btn.full{width:100%;padding:14px;font-size:15px;box-shadow:var(--shadow)}
  .btn.full:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}

  /* stage tabs */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .tab{
    border:3px solid var(--ink);border-radius:14px;padding:10px 2px;
    font-family:'Space Mono',monospace;font-weight:700;font-size:11px;text-align:center;
    background:var(--paper);cursor:pointer;box-shadow:var(--shadow-sm);
  }
  .tab .n{display:block;font-family:'Archivo Black',sans-serif;font-size:17px}
  .tab.active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .tab.locked{opacity:.45;background:#d9d0f5;box-shadow:none;cursor:default}

  /* main card */
  .card{
    border:3px solid var(--ink);border-radius:20px;background:var(--paper);
    box-shadow:var(--shadow);padding:18px 16px;
  }
  .stage-title{font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;margin:0 0 12px;
    display:inline-block;padding:4px 10px;border:3px solid var(--ink);border-radius:10px;box-shadow:var(--shadow-sm)}

  .teach{
    border:3px solid var(--ink);border-radius:14px;padding:12px 13px;
    font-size:13.5px;line-height:1.5;margin-bottom:14px;box-shadow:var(--shadow-sm);
  }
  .teach .tag{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;display:block;margin-bottom:5px}

  input[type="text"], textarea{
    width:100%;border:3px solid var(--ink);border-radius:14px;padding:12px;
    font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.5;background:#fff;
    resize:vertical;outline:none;margin-bottom:12px;
  }
  .presets{display:flex;gap:8px;margin-bottom:10px}
  .preset{
    flex:1;border:3px solid var(--ink);border-radius:10px;padding:9px 4px;
    font-weight:700;font-size:12px;background:#fff;cursor:pointer;
  }
  .preset.on{background:var(--orange);box-shadow:var(--shadow-sm)}
  .preset:disabled{opacity:.5;pointer-events:none}

  .out{
    border:3px solid var(--ink);border-radius:14px;background:#fff;
    padding:12px;margin-top:12px;box-shadow:var(--shadow-sm);
  }
  .out .lbl{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
  .out .body{font-size:13px;line-height:1.55;white-space:pre-wrap;max-height:330px;overflow-y:auto}

  .take{font-size:12.5px;line-height:1.5;margin-top:12px;padding:10px 12px;
    border:3px dashed var(--ink);border-radius:12px;background:#fff}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;
    border:3px solid var(--ink);border-radius:14px;padding:10px 13px;margin-bottom:10px;
    background:var(--lime);box-shadow:var(--shadow-sm);font-weight:700;font-size:14px}
  .switch{width:52px;height:28px;border:3px solid var(--ink);border-radius:16px;background:#fff;position:relative;cursor:pointer}
  .switch .knob{width:18px;height:18px;border-radius:50%;background:var(--ink);position:absolute;top:2px;left:3px;transition:left .12s}
  .switch.on{background:var(--lime)}
  .switch.on .knob{left:25px}

  .log{border:3px solid var(--ink);border-radius:14px;background:var(--ink);color:#fff;
    padding:12px;margin-top:12px;font-family:'Space Mono',monospace;font-size:12px}
  .log .row{display:flex;gap:8px;margin-bottom:4px}
  .pass{color:var(--lime);font-weight:700}.fail{color:var(--red);font-weight:700}
  .log .lbl{font-size:10px;letter-spacing:1.5px;color:var(--pink);margin-bottom:8px;font-weight:700}

  .score-big{font-family:'Archivo Black',sans-serif;font-size:42px;line-height:1}
  .score-big small{font-family:'Space Mono',monospace;font-size:14px}

  .iter{border:3px solid var(--ink);border-radius:14px;padding:12px;margin-top:12px;box-shadow:var(--shadow-sm);background:#fff}
  .iter .head{display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;margin-bottom:6px}
  .iter .chip{border:2px solid var(--ink);border-radius:8px;padding:1px 8px}
  .stopbox{margin-top:12px;border:3px solid var(--ink);border-radius:14px;padding:12px;
    font-family:'Space Mono',monospace;font-weight:700;font-size:13px;box-shadow:var(--shadow-sm)}

  .spin{display:inline-block;width:14px;height:14px;border:3px solid var(--ink);border-top-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .busy{margin-top:12px;font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700}

  .mantra{margin-top:18px;font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;
    line-height:1.7;text-align:center}
  .err{color:#B3261E;font-weight:700;font-size:13px;margin-top:10px}

  .hidden{display:none}

  /* topic gate additions */
  .counter{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;text-align:right;margin:-8px 0 12px;opacity:.7}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip-hint{border:2px solid var(--ink);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;
    background:#fff;cursor:pointer}
  .chip-hint:active{background:var(--orange)}
  .keybar{font-size:11.5px;font-weight:700;margin:-6px 0 14px;opacity:.85;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">LLM ENGINEERING · INTERACTIVE SANDBOX</div>
  <h1>Prompt<br>Lab</h1>
  <p class="sub">Prompt → Context → Harness → Loop. Every button is a real Groq call, generated live for your topic.</p>
  <div id="topicBar"></div>
  <div id="keyBar"></div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="stageCard"></div>

  <div class="mantra">
    prompt = the sentence · context = the ingredients<br>
    harness = the kitchen · loop = the restaurant
  </div>
</div>

<script src="config.js"></script>
<script>
/* ================= CONSTANTS ================= */
const LAYERS = {
  1:{name:'Prompt', color:'var(--orange)'},
  2:{name:'Context',color:'var(--lime)'},
  3:{name:'Harness',color:'var(--pink)'},
  4:{name:'Loop',   color:'var(--sky)'},
};
const MODEL = 'llama-3.3-70b-versatile';
const TOPIC_KEY = 'promptlab.topic';
const DEVICE_KEY = 'promptlab.groqkey';
const TOPIC_MAX_CHARS = 60;
const TOPIC_MAX_WORDS = 10;
const HINTS = ['weekly status report', 'love letter', 'grocery list', 'app idea', 'business pitch'];

/* ---- topic-driven prompt/system templates: nothing below references a fixed topic ---- */
const STAGE1_SYSTEM = 'You are a prompt engineering coach. Given a user\'s topic, write 3 different prompts a person could send to an AI assistant to accomplish that topic: one minimal/vague version, one structured version (clear role, task, format), one version that includes a short embedded example of the desired output style. Respond ONLY as JSON: {"vague": string, "structured": string, "withExample": string} — each a ready-to-send prompt string, each grounded in the user\'s actual topic, not generic placeholders.';
const buildStage1User = (topic) => 'My topic: ' + topic;

const buildStage2ContextGen = (topic) => 'Given this topic: ' + topic + ', generate a short, genuinely useful piece of background context a person would want an AI to have before helping with this — e.g. a template, a style reference, a checklist, or key constraints relevant to this exact topic. 80-150 words, plain text, no preamble.';
const buildStage2TaskPrompt = (topic) => 'Help me with the following: ' + topic + '. Give a complete, usable result.';

const STAGE3_JSON_SYS = 'Respond ONLY with valid JSON, no markdown fences, no preamble. Schema: {"qualityScore": number (0-100), "keyStrength": string, "improvementSuggestion": string, "output": string (the actual deliverable for the topic — the actual letter, list, report, or whatever the topic asks for)}';
const buildStage3User = (topic) => 'Complete this request: ' + topic + '. Score your own output quality 0-100 in qualityScore.';

const buildStage4SeedGen = (topic) => 'Write a rough first-pass attempt at: ' + topic + '. Keep it brief, it\'s meant to be improved.';
const STAGE4_LOOP_SYS = 'Respond ONLY with valid JSON, no fences, no preamble. Schema: {"qualityScore": number (0-100), "critique": string (the single biggest weakness), "revisedOutput": string (an improved version of the deliverable that better achieves the original goal)}';
const buildStage4LoopUser = (topic, draft) => 'Original goal: ' + topic + '\n\nCurrent draft:\n' + draft + '\n\nScore this draft\'s quality (0-100), name its single biggest weakness, and rewrite it as an improved version that better achieves the original goal.';

const GOAL = 85, MAX_ITERS = 4;

/* ================= STORAGE (best-effort — never throws) ================= */
function safeStorageGet(key){ try{ return localStorage.getItem(key); }catch(_){ return null; } }
function safeStorageSet(key, val){ try{ localStorage.setItem(key, val); }catch(_){} }
function safeStorageRemove(key){ try{ localStorage.removeItem(key); }catch(_){} }

/* ================= STATE ================= */
function freshStageState(){
  return {
    stage:1, unlocked:1, busy:false,
    s1:{ generating:true, err:'', vague:'', structured:'', withExample:'', preset:'vague', prompt:'', out:'', sendErr:'' },
    s2:{ generating:false, loaded:false, err:'', context:'', ctxOn:true, out:'', runErr:'' },
    s3:{ log:[], parsed:null },
    s4:{ generating:false, loaded:false, err:'', draft:'', iters:[], stop:'', stopFlag:false },
  };
}

let S = { topic:null, topicDraft:'', keyDraft:'' };
const savedTopic = safeStorageGet(TOPIC_KEY);
if(savedTopic){
  Object.assign(S, freshStageState());
  S.topic = savedTopic;
}

/* ================= KEY RESOLUTION =================
   1) localStorage (a key the user pasted in on this device — once set,
      via the prompt() fallback or the tap-to-change control, it wins:
      that's the only way to recover if the deployed config.js key goes
      bad, so it must be able to override it)
   2) config.js (window.GROQ_KEY, injected at deploy time)
   3) native window.prompt() fallback — deliberately not a custom modal */
function peekKey(){
  const stored = safeStorageGet(DEVICE_KEY);
  if(typeof stored === 'string' && stored.indexOf('gsk_') === 0){
    return { key: stored, source: 'this device' };
  }
  if(typeof window.GROQ_KEY === 'string' && window.GROQ_KEY.indexOf('gsk_') === 0){
    return { key: window.GROQ_KEY, source: 'config.js' };
  }
  return { key:'', source:null };
}
function resolveKey(){
  const peeked = peekKey();
  if(peeked.key) return peeked.key;
  const entered = window.prompt('No Groq API key found. Paste your Groq API key (gsk_...) to continue. It is stored on this device only:', '');
  if(entered && entered.indexOf('gsk_') === 0){
    safeStorageSet(DEVICE_KEY, entered);
    return entered;
  }
  return '';
}
function changeKey(){
  const entered = window.prompt('Paste your Groq API key (gsk_...). Stored on this device only:', '');
  if(entered && entered.indexOf('gsk_') === 0){ safeStorageSet(DEVICE_KEY, entered); }
  render();
}

/* ================= GROQ ================= */
async function callGroq(userContent, system){
  const key = resolveKey();
  if(!key){ throw new Error('CONFIG_KEY_MISSING'); }
  const messages = [];
  if(system) messages.push({role:'system', content:system});
  messages.push({role:'user', content:userContent});
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body: JSON.stringify({model:MODEL, messages, max_tokens:1000, temperature:0.7})
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error('HTTP '+res.status+': '+t.slice(0,140));
  }
  const data = await res.json();
  return (data.choices && data.choices[0] && data.choices[0].message.content) || '';
}
function stripFences(t){ return t.replace(/```json|```/g,'').trim(); }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function keyMissingMsg(){ return 'No Groq API key available. Add one when prompted, or check config.js.'; }

/* ================= RENDER ================= */
function render(){
  renderTopicBar();
  renderKeyBar();
  const el = document.getElementById('stageCard');
  const tabsEl = document.getElementById('tabs');
  if(!S.topic){
    tabsEl.innerHTML = '';
    el.innerHTML = viewTopicGate();
    return;
  }
  renderTabs();
  if(S.stage===1) el.innerHTML = viewS1();
  if(S.stage===2) el.innerHTML = viewS2();
  if(S.stage===3) el.innerHTML = viewS3();
  if(S.stage===4) el.innerHTML = viewS4();
}
function renderTopicBar(){
  const b = document.getElementById('topicBar');
  if(!b) return;
  if(!S.topic){ b.innerHTML=''; return; }
  b.innerHTML = `<div style="font-size:12.5px;font-weight:700;margin:-6px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%">Topic: ${esc(S.topic)}</span>
    <button class="btn" style="padding:5px 10px;font-size:11px;flex:none" onclick="changeTopic()">Change topic</button>
  </div>`;
}
function renderKeyBar(){
  const b = document.getElementById('keyBar');
  if(!b) return;
  if(!S.topic){ b.innerHTML=''; return; }
  const peeked = peekKey();
  const label = peeked.key ? ('Key: ••••' + peeked.key.slice(-4) + ' (' + peeked.source + ')') : 'No key yet — tap to add one';
  b.innerHTML = `<div class="keybar" onclick="changeKey()">${esc(label)}</div>`;
}

/* ================= TOPIC GATE ================= */
function clampWords(raw){
  let count = 0, cut = raw.length, inWord = false;
  for(let i=0;i<raw.length;i++){
    const isSpace = /\s/.test(raw[i]);
    if(!isSpace && !inWord){ count++; inWord = true; if(count > TOPIC_MAX_WORDS){ cut = i; break; } }
    if(isSpace) inWord = false;
  }
  return raw.slice(0, cut);
}
function viewTopicGate(){
  const val = S.topicDraft || '';
  const hasWord = /\S/.test(val);
  return `
  <div class="stage-title" style="background:${LAYERS[1].color}">What do you want to work on?</div>
  ${teach(1,'Type anything — a business idea, a love letter, a grocery list, a status report, an app spec. Nothing is baked in: every stage below is generated live from your topic.')}
  <input id="topicInput" type="text" maxlength="${TOPIC_MAX_CHARS}" placeholder="e.g. weekly status report for my team"
    value="${esc(val)}" oninput="onTopicInput(this)">
  <div class="counter" id="topicCounter">${val.length}/${TOPIC_MAX_CHARS}</div>
  <div class="chips">
    ${HINTS.map(h=>`<div class="chip-hint" onclick="pickHint('${h.replace(/'/g,"\\'")}')">${esc(h)}</div>`).join('')}
  </div>
  <button id="topicSubmitBtn" class="btn full" style="background:${LAYERS[1].color}" ${hasWord?'':'disabled'} onclick="submitTopic()">Start Prompt Lab</button>
  ${S.topicSetupErr?`<div class="err">${esc(S.topicSetupErr)}</div>
  <button class="btn full" style="margin-top:8px" onclick="submitTopic()">Try again</button>`:''}
  `;
}
function onTopicInput(el){
  const clamped = clampWords(el.value);
  if(clamped !== el.value){ el.value = clamped; }
  S.topicDraft = clamped;
  const counter = document.getElementById('topicCounter');
  if(counter) counter.textContent = clamped.length + '/' + TOPIC_MAX_CHARS;
  const btn = document.getElementById('topicSubmitBtn');
  if(btn) btn.disabled = !/\S/.test(clamped);
}
function pickHint(h){
  S.topicDraft = h;
  render();
}
async function submitTopic(){
  const val = (S.topicDraft||'').trim();
  if(!/\S/.test(val)) return;
  S.topic = val;
  S.topicSetupErr = '';
  safeStorageSet(TOPIC_KEY, val);
  Object.assign(S, freshStageState());
  S.topic = val;
  render();
  await generateStage1Prompts();
}
function changeTopic(){
  if(S.busy) return;
  S.topicDraft = S.topic || '';
  S.topic = null; S.topicSetupErr = '';
  safeStorageRemove(TOPIC_KEY);
  render();
}

/* ================= TABS / NAV ================= */
function renderTabs(){
  const t = document.getElementById('tabs');
  t.innerHTML = [1,2,3,4].map(i=>{
    const L=LAYERS[i], un=i<=S.unlocked, act=i===S.stage;
    return `<div class="tab ${act?'active':''} ${un?'':'locked'}"
      style="${act?'background:'+L.color:''}"
      onclick="${un?`go(${i})`:''}">
      <span class="n">${un?i:'🔒'}</span>${L.name}</div>`;
  }).join('');
}
function go(i){
  if(S.busy) return;
  S.stage=i; render();
  if(i===2 && !S.s2.loaded && !S.s2.generating) generateStage2Context();
  if(i===4 && !S.s4.loaded && !S.s4.generating) generateStage4Seed();
}
function complete(i){ if(i>=S.unlocked) S.unlocked=Math.min(i+1,4); }

function teach(stage, html){
  return `<div class="teach" style="background:${LAYERS[stage].color}">
    <span class="tag">What this layer adds</span>${html}</div>`;
}
function busyRow(txt){ return S.busy?`<div class="busy"><span class="spin"></span>${txt}</div>`:''; }

/* ================= STAGE 1 — PROMPT (dynamic) ================= */
async function generateStage1Prompts(){
  S.s1.generating = true; S.s1.err = ''; S.busy = true; render();
  try{
    const raw = await callGroq(buildStage1User(S.topic), STAGE1_SYSTEM);
    const obj = JSON.parse(stripFences(raw));
    if(!obj.vague || !obj.structured || !obj.withExample) throw new Error('incomplete response');
    S.s1.vague = obj.vague; S.s1.structured = obj.structured; S.s1.withExample = obj.withExample;
    S.s1.preset = 'vague'; S.s1.prompt = obj.vague;
  }catch(e){
    S.s1.err = e.message==='CONFIG_KEY_MISSING' ? keyMissingMsg() : 'Could not generate starter prompts (' + e.message + ').';
  }
  S.s1.generating = false; S.busy = false; render();
}
function viewS1(){
  const p=S.s1;
  if(p.generating){
    return `
    <div class="stage-title" style="background:${LAYERS[1].color}">Stage 1 — Prompt</div>
    ${teach(1,'One assembled input → one raw output. No grounding data, no validation, no retry. Try all three presets on the <b>same topic</b> and compare. Then notice what wording alone cannot fix.')}
    <div class="busy"><span class="spin"></span>Writing 3 starter prompts for your topic…</div>`;
  }
  if(p.err){
    return `
    <div class="stage-title" style="background:${LAYERS[1].color}">Stage 1 — Prompt</div>
    <div class="err">${esc(p.err)}</div>
    <button class="btn full" style="margin-top:10px" onclick="generateStage1Prompts()">Try again</button>`;
  }
  return `
  <div class="stage-title" style="background:${LAYERS[1].color}">Stage 1 — Prompt</div>
  ${teach(1,'One assembled input → one raw output. No grounding data, no validation, no retry. Try all three presets on the <b>same topic</b> and compare. Then notice what wording alone cannot fix.')}
  <div class="presets">
    ${[['Vague','vague'],['Structured','structured'],['W/ example','withExample']].map(([l,k])=>
      `<button class="preset ${p.preset===k?'on':''}" onclick="setPreset('${k}')">${l}</button>`).join('')}
  </div>
  <textarea id="s1prompt" rows="6" oninput="S.s1.prompt=this.value">${esc(p.prompt)}</textarea>
  <button class="btn full" style="background:${LAYERS[1].color}" ${S.busy?'disabled':''} onclick="runS1()">
    ${S.busy?'Calling model…':'Send prompt'}</button>
  ${busyRow('one input → one output')}
  ${p.sendErr?`<div class="err">${esc(p.sendErr)}</div>`:''}
  ${p.out?`<div class="out"><div class="lbl">Raw response</div><div class="body">${esc(p.out)}</div></div>
  <div class="take"><b>Takeaway:</b> better wording → better output, but the model still guesses your criteria. It doesn't know your context. That's a <b>context</b> problem — Stage 2 unlocked.</div>`:''}`;
}
function setPreset(k){ S.s1.preset=k; S.s1.prompt=S.s1[k]; render(); }
async function runS1(){
  S.busy=true; S.s1.out=''; S.s1.sendErr=''; render();
  try{ S.s1.out = await callGroq(S.s1.prompt); complete(1); }
  catch(e){ S.s1.sendErr = e.message==='CONFIG_KEY_MISSING'?keyMissingMsg():'Call failed ('+e.message+'). Run again — Stage 1 has no retry. That is the point.'; }
  S.busy=false; render();
}

/* ================= STAGE 2 — CONTEXT (dynamic) ================= */
async function generateStage2Context(){
  S.s2.generating = true; S.s2.err = ''; S.busy = true; render();
  try{
    const raw = await callGroq(buildStage2ContextGen(S.topic));
    S.s2.context = raw.trim();
    S.s2.loaded = true;
  }catch(e){
    S.s2.err = e.message==='CONFIG_KEY_MISSING' ? keyMissingMsg() : 'Could not generate context (' + e.message + ').';
  }
  S.s2.generating = false; S.busy = false; render();
}
function viewS2(){
  const p=S.s2;
  const taskPrompt = buildStage2TaskPrompt(S.topic);
  if(p.generating){
    return `
    <div class="stage-title" style="background:${LAYERS[2].color}">Stage 2 — Context</div>
    ${teach(2,'Same prompt, but the app now prepends real background context before the model sees the task. Toggle it off and re-run to feel the difference.')}
    <div class="busy"><span class="spin"></span>Generating context for your topic…</div>`;
  }
  if(p.err){
    return `
    <div class="stage-title" style="background:${LAYERS[2].color}">Stage 2 — Context</div>
    <div class="err">${esc(p.err)}</div>
    <button class="btn full" style="margin-top:10px" onclick="generateStage2Context()">Try again</button>`;
  }
  return `
  <div class="stage-title" style="background:${LAYERS[2].color}">Stage 2 — Context</div>
  ${teach(2,'Same prompt, but the app now <b>prepends generated background context</b> before the model sees the task. The code change is string concatenation. The output change: the model stops guessing. Toggle it off and re-run to feel it.')}
  <div class="toggle-row">Inject generated context
    <div class="switch ${p.ctxOn?'on':''}" onclick="S.s2.ctxOn=!S.s2.ctxOn;render()"><div class="knob"></div></div>
  </div>
  ${p.ctxOn?`<textarea rows="7" oninput="S.s2.context=this.value">${esc(p.context)}</textarea>`:''}
  <div class="out" style="margin:0 0 12px;box-shadow:none"><div class="lbl">Fixed prompt</div>
    <div class="body" style="font-family:'Space Mono',monospace;font-size:12px">${esc(taskPrompt)}</div></div>
  <button class="btn full" style="background:${LAYERS[2].color}" ${S.busy?'disabled':''} onclick="runS2()">
    ${S.busy?'Calling model…':(p.ctxOn?'Run WITH context':'Run WITHOUT context')}</button>
  ${busyRow('context + prompt → model')}
  ${p.runErr?`<div class="err">${esc(p.runErr)}</div>`:''}
  ${p.out?`<div class="out"><div class="lbl">${p.ctxOn?'Grounded':'Ungrounded'} response</div><div class="body">${esc(p.out)}</div></div>
  <div class="take"><b>Takeaway:</b> context beats cleverness. But output is still free text — nothing guarantees it parses, nothing catches failure. That's a <b>harness</b> problem — Stage 3 unlocked.</div>`:''}`;
}
async function runS2(){
  S.busy=true; S.s2.out=''; S.s2.runErr=''; render();
  try{
    const taskPrompt = buildStage2TaskPrompt(S.topic);
    const full = S.s2.ctxOn ? S.s2.context+'\n\n---\n\n'+taskPrompt : taskPrompt;
    S.s2.out = await callGroq(full); complete(2);
  }catch(e){ S.s2.runErr = e.message==='CONFIG_KEY_MISSING'?keyMissingMsg():'Call failed — try again. ('+e.message+')'; }
  S.busy=false; render();
}

/* ================= STAGE 3 — HARNESS (dynamic, generic schema) ================= */
function viewS3(){
  const p=S.s3;
  return `
  <div class="stage-title" style="background:${LAYERS[3].color}">Stage 3 — Harness</div>
  ${teach(3,'The app now <b>demands JSON, validates with JSON.parse(), and auto-retries once on failure</b> — logging every attempt with latency. You stop reading outputs and start reading a run log. The system catches failure, not you.')}
  <button class="btn full" style="background:${LAYERS[3].color}" ${S.busy?'disabled':''} onclick="runS3()">
    ${S.busy?'Harness running…':'Run harnessed call'}</button>
  ${busyRow('call → validate → retry if needed')}
  ${p.log.length?`<div class="log"><div class="lbl">RUN LOG</div>
    ${p.log.map(e=>`<div class="row"><span>#${e.attempt}</span>
      <span class="${e.status==='PASS'?'pass':'fail'}">${e.status}</span>
      <span>${esc(e.detail)}</span></div>`).join('')}</div>`:''}
  ${p.parsed?`<div class="out" style="background:${LAYERS[3].color}">
    <div class="score-big">${p.parsed.qualityScore}<small> / 100</small></div>
    <div style="font-size:13px;line-height:1.55;margin-top:8px">
      <div><b>Key strength:</b> ${esc(String(p.parsed.keyStrength))}</div>
      <div><b>Improvement suggestion:</b> ${esc(String(p.parsed.improvementSuggestion))}</div></div></div>
  <div class="out"><div class="lbl">Generated output</div><div class="body">${esc(String(p.parsed.output))}</div></div>
  <div class="take"><b>Takeaway:</b> structured output + validation + retry = a call you can build on. But it's still <b>one</b> call. Improving something until it clears a bar is a <b>loop</b> problem — Stage 4 unlocked.</div>`:''}`;
}
async function runS3(){
  S.busy=true; S.s3={log:[],parsed:null}; render();
  const MAX=2;
  for(let a=1;a<=MAX;a++){
    const t0=Date.now();
    try{
      const raw = await callGroq(buildStage3User(S.topic), STAGE3_JSON_SYS);
      const ms=Date.now()-t0;
      try{
        const obj = JSON.parse(stripFences(raw));
        S.s3.log.push({attempt:a,status:'PASS',detail:'valid JSON · '+ms+'ms'});
        S.s3.parsed=obj; complete(3); S.busy=false; render(); return;
      }catch(_){
        S.s3.log.push({attempt:a,status:'FAIL',detail:'malformed JSON · '+ms+'ms · '+(a<MAX?'auto-retrying':'brake tripped')});
        render();
      }
    }catch(e){
      if(e.message==='CONFIG_KEY_MISSING'){ S.s3.log.push({attempt:a,status:'FAIL',detail:'no API key available'}); S.busy=false; render(); return; }
      S.s3.log.push({attempt:a,status:'FAIL',detail:'network/API error · '+(a<MAX?'auto-retrying':'brake tripped')});
      render();
    }
  }
  S.busy=false; render();
}

/* ================= STAGE 4 — LOOP (dynamic, generic goal) ================= */
async function generateStage4Seed(){
  S.s4.generating = true; S.s4.err = ''; S.busy = true; render();
  try{
    S.s4.draft = (await callGroq(buildStage4SeedGen(S.topic))).trim();
    S.s4.loaded = true;
  }catch(e){
    S.s4.err = e.message==='CONFIG_KEY_MISSING' ? keyMissingMsg() : 'Could not generate a starting draft (' + e.message + ').';
  }
  S.s4.generating = false; S.busy = false; render();
}
function viewS4(){
  const p=S.s4;
  if(p.generating){
    return `
    <div class="stage-title" style="background:${LAYERS[4].color}">Stage 4 — Loop</div>
    ${teach(4,`Goal + stop rule: <b>revise until quality ≥ ${GOAL}, max ${MAX_ITERS} iterations</b>. Each cycle: score → critique → revise → re-score, feeding results back as new context.`)}
    <div class="busy"><span class="spin"></span>Writing a rough starting draft…</div>`;
  }
  if(p.err){
    return `
    <div class="stage-title" style="background:${LAYERS[4].color}">Stage 4 — Loop</div>
    <div class="err">${esc(p.err)}</div>
    <button class="btn full" style="margin-top:10px" onclick="generateStage4Seed()">Try again</button>`;
  }
  return `
  <div class="stage-title" style="background:${LAYERS[4].color}">Stage 4 — Loop</div>
  ${teach(4,`Goal + stop rule: <b>revise until quality ≥ ${GOAL}, max ${MAX_ITERS} iterations</b>. Each cycle: score → critique → revise → re-score, feeding results back as new context. The run ends when the job is done or the brake trips — never "when the model stops talking."`)}
  <textarea rows="4" oninput="S.s4.draft=this.value">${esc(p.draft)}</textarea>
  <div style="display:flex;gap:8px">
    <button class="btn full" style="background:${LAYERS[4].color};flex:3" ${S.busy?'disabled':''} onclick="runS4()">
      ${S.busy?'Loop running…':'Run loop'}</button>
    <button class="btn" style="background:var(--red);flex:1" ${S.busy?'':'disabled'} onclick="S.s4.stopFlag=true">STOP</button>
  </div>
  ${busyRow('iterating toward quality ≥ '+GOAL)}
  ${p.iters.map(it=>`<div class="iter" style="${it.score!==null&&it.score>=GOAL?'background:'+LAYERS[4].color:''}">
    <div class="head"><span>ITERATION ${it.n}</span>
      <span class="chip">${it.score===null?'ERR':it.score+'/100'}</span></div>
    <div style="font-size:13px;line-height:1.5"><b>Improvement needed:</b> ${esc(String(it.critique))}</div>
    <div style="font-size:13px;line-height:1.5;margin-top:6px"><b>Revised output →</b> ${esc(String(it.revisedOutput))}</div>
  </div>`).join('')}
  ${p.stop?`<div class="stopbox" style="background:${p.stop.startsWith('GOAL')?LAYERS[4].color:'var(--orange)'}">${esc(p.stop)}</div>
  <div class="take"><b>Takeaway:</b> the unit of work is the <b>run</b>, not the reply. Try a different topic and see how the loop adapts.</div>`:''}`;
}
async function runS4(){
  S.busy=true; S.s4.iters=[]; S.s4.stop=''; S.s4.stopFlag=false; render();
  let current=S.s4.draft;
  for(let i=1;i<=MAX_ITERS;i++){
    if(S.s4.stopFlag){ S.s4.stop='STOPPED — manual brake'; break; }
    try{
      const raw = await callGroq(buildStage4LoopUser(S.topic, current), STAGE4_LOOP_SYS);
      const obj = JSON.parse(stripFences(raw));
      S.s4.iters.push({n:i,score:obj.qualityScore,critique:obj.critique,revisedOutput:obj.revisedOutput});
      render();
      if(obj.qualityScore>=GOAL){
        S.s4.stop='GOAL MET — quality '+obj.qualityScore+' ≥ '+GOAL+' in '+i+' iteration'+(i>1?'s':'');
        complete(4); S.busy=false; render(); return;
      }
      current=obj.revisedOutput;
    }catch(e){
      if(e.message==='CONFIG_KEY_MISSING'){ S.s4.stop='CONFIG ERROR — no API key available'; S.busy=false; render(); return; }
      S.s4.iters.push({n:i,score:null,critique:'iteration failed (parse/network) — loop continues',revisedOutput:current});
      render();
    }
  }
  if(!S.s4.stopFlag && !S.s4.stop) S.s4.stop='BRAKE TRIPPED — max '+MAX_ITERS+' iterations, goal not met';
  complete(4); S.busy=false; render();
}

/* ================= INIT ================= */
render();
if(S.topic && S.s1.generating && !S.s1.vague && !S.s1.err){ generateStage1Prompts(); }
</script>
